<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date - Zev Shapero & Rachel Winer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e8e4df;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .card {
      width: 500px;
      background-color: #f5f2ed;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
    }

    .save-the-date {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      font-style: italic;
      color: #5a7a6a;
      margin-bottom: 8px;
      font-weight: 400;
      line-height: 1.2;
    }

    .date-time {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      color: #3a3a3a;
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .for-wedding {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 18px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 300;
    }

    .names {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 38px;
      color: #5a7a6a;
      line-height: 1.25;
      margin-bottom: 4px;
      font-weight: 400;
    }

    .ampersand {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 32px;
      color: #5a7a6a;
      line-height: 1;
      font-weight: 400;
    }

    .photo-container {
      margin: 20px auto;
      width: 90%;
    }

    .photo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .venue {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 17px;
      color: #3a3a3a;
      line-height: 1.7;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .venue-line {
      display: block;
    }

    .formal-invite {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 17px;
      color: #5a7a6a;
      margin-top: 18px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="save-the-date">Save the Date</div>
    <div class="date-time">October 31st, 5:30pm</div>
    <div class="for-wedding">for the wedding of</div>
    <div class="names">Zev Shapero</div>
    <div class="ampersand">&amp;</div>
    <div class="names">Rachel Winer</div>

    <div class="photo-container">
      <img src="DTS0179TheDistilleryHistoricDistrict_Toronto-DowntownSketcher_7.png" alt="The Distillery Historic District, Toronto">
    </div>

    <div class="venue">
      <span class="venue-line">Ceremony at The Loft &amp; Archeo</span>
      <span class="venue-line">Distillery District &bull; Toronto</span>
    </div>

    <div class="formal-invite">Formal invitation to follow</div>
  </div>
</body>
</html>
